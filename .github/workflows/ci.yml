name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Wfx.sln
      - run: dotnet test Wfx.sln -c Release --no-restore --logger "trx;LogFileName=tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  publish:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Native AOT
        shell: pwsh
        run: dotnet publish src/Wfx.Cli/Wfx.Cli.csproj -c Release -r ${{ matrix.rid }} -o artifacts/${{ matrix.rid }}
      - name: Measure artifact
        shell: pwsh
        run: |
          $exe = Resolve-Path "artifacts/${{ matrix.rid }}/wfx.exe"
          $size = (Get-Item $exe).Length
          $elapsed = Measure-Command { & $exe --version | Out-Null }
          $stdout = Join-Path $env:RUNNER_TEMP "wfx-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "wfx-stderr.txt"
          $process = Start-Process $exe -ArgumentList "--help" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $peak = $process.PeakWorkingSet64
          while (-not $process.WaitForExit(10)) {
            $process.Refresh()
            $peak = [Math]::Max($peak, $process.PeakWorkingSet64)
          }
          "### ${{ matrix.rid }}" >> $env:GITHUB_STEP_SUMMARY
          "- Binary size: $([Math]::Round($size / 1MB, 2)) MiB" >> $env:GITHUB_STEP_SUMMARY
          "- Warm startup: $([Math]::Round($elapsed.TotalMilliseconds, 1)) ms" >> $env:GITHUB_STEP_SUMMARY
          "- Peak working set (`--help`): $([Math]::Round($peak / 1MB, 2)) MiB" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: wfx-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/wfx.exe
